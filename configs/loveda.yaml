# arguments for dataset
dataset: loveda
nclass: 8
crop_size: 518
data_root: datasets/LoveDA

# arguments for training
epochs: 20
batch_size: 4 # per GPU
lr: 0.000005
lr_multi: 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

# arguments for model
model: dpt
backbone: dinov2_small
lock_backbone: False

use_vlm_pp: true
vlm_type: qwen_vl
vlm_pp_conf_threshold: 0.7
qwen_model_name: pretrained/qwen2_5_vl_3b_instruct
use_vlm_on_mismatch: true

# ==========================
# CEE Edge-aware Module
# ==========================
# use_cee: False keeps the original SemiEarth baseline behaviour.
use_cee: true
# Edge-aware pseudo label selection at the unsupervised loss.
use_edge_threshold: true
# CEE-guided VLM purification (low-conf & edge targets + edge fusion boost).
use_cee_vlm: true
# Edge dilation window (1/0 = off, odd values recommended).
edge_width: 3
# Relaxed confidence threshold for semantic boundary pixels.
edge_conf_thresh: 0.75
# VLM influence multiplier on edge pixels during confidence fusion.
edge_vlm_weight: 1.5
# Reuse cached VLM spatial probs across iterations. Auto (unset): disabled in
# CEE-guided mode, enabled for the baseline. Set explicitly to force it.
# use_vlm_cache: false
# Save 7-panel CEE debug figures to <save_path>/debug_cee once per epoch.
save_cee_debug: false
# Print per-iteration CEE-VLM diagnostic counters (edge/low-conf/target pixels).
cee_debug: false
# Skip VLM refinement when target pixels below this count (0 = always run).
min_edge_pixels: 0

# Training-only CTSA; keep every existing CEE option above unchanged.
use_ctsa: true
ctsa_dim: 128
ctsa_heads: 4
ctsa_alpha: 0.1
ctsa_temperature: 0.1
ctsa_weight: 0.1
ctsa_warmup_ratio: 0.1
ctsa_ramp_ratio: 0.1
# none = basic CTSA; confidence = confidence gate; agreement = purified-label gate.
ctsa_gate: agreement
ctsa_gate_statistics: false
ctsa_reject_corrected: true

# Runtime optimizations (no changes to CEE thresholds, sampling or fusion).
amp: true
amp_dtype: auto
teacher_amp: false
eval_amp: false
num_workers: 4
val_num_workers: 2
persistent_workers: true
prefetch_factor: 2
log_interval: 50
profile_steps: 5
qwen_batch_size: 4
qwen_attention: sdpa
