<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SemiEarth + CEE-guided Edge-aware VLM Purification — 模型架构图</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --surface: #ffffff;
    --grid: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f8fafc;
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 32px 16px;
  }
  .wrap { max-width: 1220px; margin: 0 auto; }
  .title { text-align: center; margin-bottom: 4px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  svg { display: block; width: 100%; height: auto; background: var(--surface); border: 1px solid var(--grid); border-radius: 12px; }
  text { font-family: inherit; }
  .node-title { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .node-sub   { font-size: 12px; fill: var(--muted); }
  .node-shape { font-size: 11.5px; fill: var(--muted); font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .arrow      { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .arrow-dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .edge-label { font-size: 11px; fill: #94a3b8; }
  .legend-txt { font-size: 12.5px; fill: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">SemiEarth + CEE-guided Edge-aware VLM Purification</div>
  <div class="subtitle">CEE（多类别语义边缘提取）驱动的边缘感知伪标签选择 + 边缘引导 VLM 净化（Qwen2.5-VL + SAM）</div>

  <svg viewBox="0 0 1200 1600" role="img" aria-label="模型架构图">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- ============ 图例 ============ -->
    <g transform="translate(20, 14)">
      <rect x="0"   y="0" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="150" y="0" width="14" height="14" rx="3" fill="#dcfce7" stroke="#059669"/>
      <rect x="300" y="0" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
      <rect x="450" y="0" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
      <rect x="600" y="0" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/>
      <rect x="760" y="0" width="14" height="14" rx="3" fill="#ffedd5" stroke="#d97706"/>
      <text class="legend-txt" x="20"  y="12">主干模型 (DINOv2/DPT)</text>
      <text class="legend-txt" x="170" y="12">CEE (新增·无参)</text>
      <text class="legend-txt" x="320" y="12">VLM (Qwen+SAM)</text>
      <text class="legend-txt" x="470" y="12">损失</text>
      <text class="legend-txt" x="620" y="12">张量/中间量</text>
      <text class="legend-txt" x="780" y="12">边缘阈值/选择</text>
    </g>

    <!-- ============ 左列：Student 分支（监督 + 强增强） ============ -->
    <rect x="45" y="90" width="230" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="160" y="112" text-anchor="middle">Labeled Image</text>
    <text class="node-shape" x="160" y="132" text-anchor="middle">[B, 3, 518, 518]</text>

    <rect x="45" y="200" width="230" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="160" y="222" text-anchor="middle">Unlabeled (strong aug)</text>
    <text class="node-shape" x="160" y="242" text-anchor="middle">[B, 3, 518, 518]</text>

    <rect x="45" y="320" width="230" height="68" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text class="node-title" x="160" y="342" text-anchor="middle">Student</text>
    <text class="node-sub" x="160" y="360" text-anchor="middle">DINOv2 → DPT Decoder</text>
    <text class="node-shape" x="160" y="378" text-anchor="middle">pred_x / pred_u_s [B,C,H,W]</text>

    <rect x="45" y="1420" width="230" height="54" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="160" y="1442" text-anchor="middle">Supervised Loss</text>
    <text class="node-shape" x="160" y="1462" text-anchor="middle">CE(pred_x, mask_x)</text>

    <path class="arrow" d="M 160 144 L 160 198"/>
    <path class="arrow" d="M 160 254 L 160 318"/>
    <path class="arrow" d="M 160 388 L 160 1418"/>
    <!-- student → unsupervised loss (pred_u_s) -->
    <path class="arrow" d="M 275 364 L 300 364 L 300 1500 L 590 1500 L 590 1476"/>
    <text class="edge-label" x="282" y="358">pred_u_s</text>

    <!-- ============ 主流程：EMA Teacher ============ -->
    <rect x="450" y="90" width="280" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="590" y="112" text-anchor="middle">Unlabeled Image (weak aug)</text>
    <text class="node-shape" x="590" y="132" text-anchor="middle">[B, 3, 518, 518]</text>

    <rect x="450" y="200" width="280" height="68" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text class="node-title" x="590" y="222" text-anchor="middle">EMA Teacher</text>
    <text class="node-sub" x="590" y="240" text-anchor="middle">DINOv2 Backbone → DPT Decoder</text>
    <text class="node-shape" x="590" y="258" text-anchor="middle">no_grad · detach</text>

    <rect x="450" y="320" width="280" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="590" y="342" text-anchor="middle">Teacher Logits</text>
    <text class="node-shape" x="590" y="362" text-anchor="middle">[B, C, H, W]</text>

    <path class="arrow" d="M 590 144 L 590 198"/>
    <path class="arrow" d="M 590 268 L 590 318"/>

    <!-- 分叉：pseudo / conf -->
    <path class="arrow" d="M 590 374 L 590 410"/>
    <path class="arrow" d="M 590 410 L 440 410 L 440 438"/>
    <path class="arrow" d="M 590 410 L 740 410 L 740 438"/>

    <rect x="340" y="440" width="200" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="440" y="462" text-anchor="middle">Pseudo Labels</text>
    <text class="node-shape" x="440" y="482" text-anchor="middle">argmax · [B, H, W]</text>

    <rect x="640" y="440" width="200" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="740" y="462" text-anchor="middle">Confidence Scores</text>
    <text class="node-shape" x="740" y="482" text-anchor="middle">softmax.max · [B, H, W]</text>

    <!-- CEE -->
    <path class="arrow" d="M 440 494 L 440 520 L 590 520 L 590 558"/>

    <rect x="450" y="560" width="280" height="68" rx="10" fill="#dcfce7" stroke="#059669"/>
    <text class="node-title" x="590" y="582" text-anchor="middle">Multi-class CEE</text>
    <text class="node-sub" x="590" y="600" text-anchor="middle">邻域差分 + max_pool 膨胀 · 零参数</text>
    <text class="node-shape" x="590" y="618" text-anchor="middle">util/cee.py · edge_width=3</text>

    <path class="arrow" d="M 590 628 L 590 678"/>

    <!-- Edge Map -->
    <rect x="450" y="680" width="280" height="54" rx="10" fill="#dcfce7" stroke="#059669"/>
    <text class="node-title" x="590" y="702" text-anchor="middle">Semantic Edge Map</text>
    <text class="node-shape" x="590" y="722" text-anchor="middle">bool · [B, H, W] · 1=edge</text>

    <!-- Edge Map → Low-conf∩Edge (直下) -->
    <path class="arrow" d="M 590 734 L 590 798"/>

    <!-- Low-conf ∩ Edge -->
    <rect x="450" y="800" width="280" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="590" y="822" text-anchor="middle">Low-conf ∩ Edge (VLM target)</text>
    <text class="node-shape" x="590" y="842" text-anchor="middle">edge &amp; conf&lt;0.7 · priority_mask</text>

    <path class="arrow" d="M 590 854 L 590 918"/>

    <!-- Qwen + SAM -->
    <rect x="450" y="920" width="280" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="590" y="942" text-anchor="middle">Qwen2.5-VL + SAM</text>
    <text class="node-sub" x="590" y="960" text-anchor="middle">整体 Grounding → SAM 空间 mask</text>
    <text class="node-shape" x="590" y="978" text-anchor="middle">仅对含目标图像推理 · 可跳过</text>

    <path class="arrow" d="M 590 988 L 590 1048"/>

    <!-- VLM Spatial Prob -->
    <rect x="450" y="1050" width="280" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="590" y="1072" text-anchor="middle">VLM Spatial Prob</text>
    <text class="node-shape" x="590" y="1092" text-anchor="middle">[B, C, H, W]</text>

    <path class="arrow" d="M 590 1104 L 590 1168"/>

    <!-- Fusion -->
    <rect x="450" y="1170" width="280" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="node-title" x="590" y="1192" text-anchor="middle">Edge-aware Conf Fusion</text>
    <text class="node-shape" x="590" y="1210" text-anchor="middle">semi·conf + qwen·qwen_conf</text>
    <text class="node-shape" x="590" y="1226" text-anchor="middle">edge 像素 qwen 权重 ×1.5</text>

    <path class="arrow" d="M 590 1238 L 590 1298"/>

    <!-- Refined -->
    <rect x="450" y="1300" width="280" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text class="node-title" x="590" y="1322" text-anchor="middle">Refined Pseudo Labels</text>
    <text class="node-shape" x="590" y="1342" text-anchor="middle">refined_conf / refined_labels [B,H,W]</text>

    <path class="arrow" d="M 590 1354 L 590 1418"/>

    <!-- Unsupervised Loss -->
    <rect x="450" y="1420" width="280" height="54" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text class="node-title" x="590" y="1442" text-anchor="middle">Unsupervised Loss</text>
    <text class="node-shape" x="590" y="1462" text-anchor="middle">CE(pred_u_s, refined) × conf_mask</text>

    <!-- ============ 右列：Edge-aware 损失掩码 ============ -->
    <!-- Edge Map → Edge-aware Threshold -->
    <path class="arrow" d="M 730 707 L 960 707 L 960 798"/>

    <rect x="860" y="800" width="200" height="68" rx="10" fill="#ffedd5" stroke="#d97706"/>
    <text class="node-title" x="960" y="822" text-anchor="middle">Edge-aware Threshold</text>
    <text class="node-shape" x="960" y="842" text-anchor="middle">~edge &amp; conf≥0.95</text>
    <text class="node-shape" x="960" y="858" text-anchor="middle">| edge &amp; conf≥0.85</text>

    <path class="arrow" d="M 960 868 L 960 938"/>

    <rect x="860" y="940" width="200" height="54" rx="10" fill="#ffedd5" stroke="#d97706"/>
    <text class="node-title" x="960" y="962" text-anchor="middle">conf_mask</text>
    <text class="node-shape" x="960" y="982" text-anchor="middle">Reliable ∪ Interior</text>

    <!-- conf_mask → Unsupervised Loss -->
    <path class="arrow" d="M 960 994 L 960 1447 L 732 1447"/>

    <!-- ============ 置信度汇入（conf rail） ============ -->
    <path class="arrow" d="M 740 494 L 810 494 L 810 1204"/>
    <path class="arrow" d="M 810 830 L 732 830"/>
    <path class="arrow" d="M 810 830 L 858 830"/>
    <path class="arrow" d="M 810 1204 L 732 1204"/>

    <!-- Edge boost (dashed) -->
    <path class="arrow-dash" d="M 450 707 L 420 707 L 420 1204 L 450 1204"/>
    <text class="edge-label" x="360" y="1000" transform="rotate(-90 360 1000)">edge_vlm_weight boost (×1.5)</text>
  </svg>
</div>
</body>
</html>
